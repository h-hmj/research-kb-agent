services:
  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-agent:0.1.0
    container_name: research-agent
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "科研知识库与实验助理 Agent"
      APP_VERSION: "0.1.0"
      DEBUG: "false"
      API_PREFIX: "/api/v1"
      LOG_LEVEL: "INFO"
      DATA_DIR: "/app/data"
      MAX_UPLOAD_SIZE_MB: "20"
      DOCUMENTS_DIR: "/app/data/documents"
      METADATA_DIR: "/app/data/metadata"
      CHUNKS_DIR: "/app/data/chunks"
      VECTOR_STORE_DIR: "/app/data/vector_store"
      EMBEDDING_MODEL_PATH: "/app/models/bge-small-zh-v1.5"
      EMBEDDING_DEVICE: "cpu"
      EMBEDDING_NORMALIZE: "true"
      CHUNK_SIZE: "500"
      CHUNK_OVERLAP: "80"
      RETRIEVAL_TOP_K: "5"
      MAX_RETRIEVAL_TEXT_LENGTH: "1000"
      QA_TOP_K: "${QA_TOP_K:-5}"
      MIN_RETRIEVAL_SCORE: "${MIN_RETRIEVAL_SCORE:-0.35}"
      MIN_EVIDENCE_COUNT: "${MIN_EVIDENCE_COUNT:-1}"
      MAX_CONTEXT_CHARS: "${MAX_CONTEXT_CHARS:-6000}"
      MAX_CITATION_TEXT_LENGTH: "${MAX_CITATION_TEXT_LENGTH:-500}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      LLM_MODEL: "${LLM_MODEL:-qwen2.5:3b-instruct}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-180}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.0}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-512}"
      ENABLE_QUERY_REWRITE: "${ENABLE_QUERY_REWRITE:-true}"
      MAX_QUERY_REWRITE_ATTEMPTS: "${MAX_QUERY_REWRITE_ATTEMPTS:-1}"
      REWRITE_MAX_CHARS: "${REWRITE_MAX_CHARS:-500}"
      AGENT_TOP_K: "${AGENT_TOP_K:-5}"
      AGENT_MAX_CONTEXT_CHARS: "${AGENT_MAX_CONTEXT_CHARS:-6000}"
      AGENT_TRACE_ENABLED: "${AGENT_TRACE_ENABLED:-true}"
      MAX_MEETING_CONTEXT_CHARS: "${MAX_MEETING_CONTEXT_CHARS:-16000}"
      ENABLE_STREAMING: "${ENABLE_STREAMING:-true}"
      STREAM_HEARTBEAT_SECONDS: "${STREAM_HEARTBEAT_SECONDS:-15}"
      ENABLE_FILE_LOGGING: "${ENABLE_FILE_LOGGING:-false}"
      LOG_DIR: "${LOG_DIR:-/app/data/logs}"
      LOG_MAX_BYTES: "${LOG_MAX_BYTES:-5242880}"
      LOG_BACKUP_COUNT: "${LOG_BACKUP_COUNT:-3}"
      ENABLE_METRICS_ENDPOINT: "${ENABLE_METRICS_ENDPOINT:-true}"
      EVAL_DATASET_DIR: "${EVAL_DATASET_DIR:-/app/eval/datasets}"
      EVALUATION_DIR: "${EVALUATION_DIR:-/app/data/evaluations}"
      EVALUATION_MAX_CASES: "${EVALUATION_MAX_CASES:-100}"
      EVALUATION_MAX_ERROR_RATE: "${EVALUATION_MAX_ERROR_RATE:-0.2}"
      EVALUATION_SAVE_DETAILS: "${EVALUATION_SAVE_DETAILS:-false}"
    volumes:
      - research_data:/app/data
      - ./models:/app/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  research_data:
